syntax = "proto3";

package announcements;

option go_package = ".";

message SearchAnnouncementsRequest {
  int64 offset = 1;
  int64 userID = 2;
  string searchString = 3;
  string category = 4;
  string orderby = 5;
  int64 announcementID = 6;
  int64 authorID = 7;
}

message SearchAnnouncementsResponse {
  repeated AnnouncementData announcementsData = 1;
}

message AnnouncementData {
  string authorName = 1;
  int64 authorID = 2;
  string title = 3;
  string description = 4;
  string category = 5;
  string linkToAnnouncement = 6;
  int64 announcementID = 7;
  repeated string images = 8;
}

message CreateAnnouncementRequest {
  string title = 1;
  string description = 2;
  string category = 3;
  int64 authorID = 4;
}

message CreateAnnouncementResponse {
  int64 announcementID = 1;
}

message AddImagesRequest {
  repeated string imagesPath = 1;
  int64 announcementID = 2;
}

message AddImagesResponse {}

message DeleteAnnouncementRequest {
  int64 announcementID = 1;
  int64 userID = 2;
}

message DeleteAnnouncementResponse {}

service Announcements {
  rpc SearchAnnouncements(SearchAnnouncementsRequest) returns (SearchAnnouncementsResponse);
  rpc CreateAnnouncement(CreateAnnouncementRequest) returns (CreateAnnouncementResponse);
  rpc AddImages(AddImagesRequest) returns (AddImagesResponse);
  rpc DeleteAnnouncement(DeleteAnnouncementRequest) returns (DeleteAnnouncementResponse);
}
